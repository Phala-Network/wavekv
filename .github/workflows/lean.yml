name: Lean proofs

on:
  push:
    branches: [main]
    paths: ['formal/**', '.github/workflows/lean.yml']
  pull_request:
    branches: [main]
    paths: ['formal/**', '.github/workflows/lean.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject axioms and unchecked code
        run: "! grep -rnE '^\\s*(axiom|unsafe|@\\[implemented_by|@\\[extern)|native_decide' --include='*.lean' formal"

      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
